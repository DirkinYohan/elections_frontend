<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Preconteo electoral</title>
    <style>
      :root { color-scheme: light dark; --bg: #f4f5f7; --surface: #fff; --ink: #14171f; --ink-3: #6b7280; --line: #d9dde4; --accent: #1d4ed8; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0f1218; --surface: #171b23; --ink: #eef0f4; --ink-3: #8b93a3; --line: #2c323e; --accent: #6d9bff; } }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
      h1 { margin: 0 0 4px; font-size: 1.6rem; }
      p { margin: 0 0 20px; color: var(--ink-3); }
      ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
      a { display: block; height: 100%; padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: inherit; text-decoration: none; }
      a:hover, a:focus-visible { border-color: var(--accent); outline: none; }
      a strong { display: block; color: var(--accent); margin-bottom: 4px; }
      a span { font-size: 0.9rem; color: var(--ink-3); }
    </style>
  </head>
  <body>
    <main>
      <h1>Preconteo electoral</h1>
      <p>Transmisión y difusión de resultados en tiempo real.</p>
      <ul>
        <li><a href="/results/"><strong>Resultados públicos</strong><span>SSE · por departamento, municipio o puesto</span></a></li>
        <li><a href="/poll-worker/"><strong>Transmisión de actas</strong><span>Jurados · HTTP con cola offline</span></a></li>
        <li><a href="/auditor/"><strong>Consola de verificación</strong><span>Auditores · WebSocket</span></a></li>
        <li><a href="/operations/"><strong>Operación</strong><span>Coordinador · presencia y métricas</span></a></li>
      </ul>
    </main>
  </body>
</html>
